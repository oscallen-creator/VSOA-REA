<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DownCloud</title>
<style>
/* Layout follows the artwork: every number is a pixel position in the 906px-wide mockup, scaled by --u. */
:root { color-scheme: light; --ink:#1c1f27; --red:#c62127; }
[hidden] { display:none !important; }
html { background:#faf2e7; }
body { margin:0; font-family:system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); }
main { container-type:inline-size; --u:calc(100cqw / 906); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.hero, .birds { position:relative; background:top / 100% auto no-repeat; }
.hero { aspect-ratio:906 / 1735; background-image:url('/hero.webp'); }
.birds { aspect-ratio:905 / 1738; background-image:url('/tracks.webp'); }
.at { position:absolute; box-sizing:border-box; left:calc(var(--x) * var(--u)); top:calc(var(--y) * var(--u)); width:calc(var(--w) * var(--u)); height:calc(var(--h) * var(--u)); }

#url { --x:452; --y:950; --w:410; --h:62; border:0; padding:0; background:transparent; color:var(--ink); outline:none; font:max(13px, calc(25 * var(--u))) system-ui, sans-serif; }
#url::placeholder { color:#8b8984; font-style:italic; }
#go { --x:437; --y:1042; --w:397; --h:89; border:0; padding:0; border-radius:calc(6 * var(--u)); background:transparent; cursor:pointer; }
#go:hover { backdrop-filter:brightness(1.08); }
#go:active { backdrop-filter:brightness(.9); }
#go:disabled { backdrop-filter:grayscale(.7) brightness(1.12); cursor:progress; }
#go:focus-visible, .mp3:focus-visible, #more:focus-visible { outline:calc(3 * var(--u)) solid var(--ink); outline-offset:calc(3 * var(--u)); }
#status { --x:420; --y:1132; --w:430; --h:27; margin:0; text-align:center; font-size:max(11px, calc(17 * var(--u))); line-height:calc(27 * var(--u)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.err { color:var(--red) !important; border-color:var(--red) !important; }
#more { --x:530; --y:1650; --w:100; --h:44; border:0; background:none; color:var(--ink); cursor:pointer; font:900 calc(30 * var(--u)) / 1 system-ui, sans-serif; letter-spacing:calc(6 * var(--u)); }

ol { list-style:none; margin:0; padding:0; }
li { position:relative; display:flex; align-items:center; box-sizing:border-box; }
/* Row rule; --line lets a row's rule start later (the bird rows that sit next to the wing tip). */
li::after { content:''; position:absolute; left:calc(var(--line, 0) * var(--u)); right:0; bottom:0; height:var(--lw); background:rgba(28, 31, 39, .8); }
.txt { flex:1; min-width:0; }
.t, .s { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t { font-weight:700; }
.s { color:#34363c; }
.mp3 { flex:none; display:flex; align-items:center; justify-content:center; box-sizing:border-box; border:calc(3 * var(--u)) solid var(--ink); color:var(--ink); font-weight:800; text-decoration:none; white-space:nowrap; }
.mp3[aria-disabled="true"] { opacity:.55; pointer-events:none; }

/* Hero list: first four tracks, like the mockup. */
#top { --x:343; --y:1272; --w:505; height:auto; }
#top li { height:calc(93 * var(--u)); --lw:calc(2 * var(--u)); }
#top .tile { width:calc(78 * var(--u)); margin:0 calc(16 * var(--u)) 0 calc(-4 * var(--u)); }
#top .t { font-size:max(12px, calc(22 * var(--u))); }
#top .s { font-size:max(11px, calc(18 * var(--u))); margin-top:calc(4 * var(--u)); }
#top .mp3 { width:calc(113 * var(--u)); height:calc(46 * var(--u)); margin:0 calc(4 * var(--u)) 0 calc(14 * var(--u)); }
#top .mp3, #zip { border-radius:calc(8 * var(--u)); font-size:max(11px, calc(22 * var(--u))); }
#zip { --x:796; --y:1192; --w:92; --h:44; }

/* Bird pages: the rest of the playlist, eleven rows per page, last two stepping right around the wing. */
.birds ol { --x:412; --y:149; --w:480; height:auto; }
.birds li { height:calc(136.2 * var(--u)); padding-top:calc(14 * var(--u)); --lw:calc(4 * var(--u)); }
.birds li:nth-child(10) { margin-left:calc(35 * var(--u)); --line:25; }
.birds li:nth-child(11) { margin-left:calc(70 * var(--u)); --line:20; }
.birds .tile { width:calc(95 * var(--u)); margin:0 calc(15 * var(--u)) 0 calc(3 * var(--u)); }
.birds .t { font-size:max(13px, calc(25 * var(--u))); }
.birds .s { font-size:max(11px, calc(19 * var(--u))); margin-top:calc(5 * var(--u)); }
.birds .mp3 { width:calc(124 * var(--u)); height:calc(50 * var(--u)); margin-left:calc(14 * var(--u)); border-radius:calc(10 * var(--u)); font-size:max(12px, calc(25 * var(--u))); }
</style>
</head>
<body>
<main>
<section class="hero">
  <h1 class="sr">Ultimate SoundCloud Downloader</h1>
  <form id="f">
    <label class="sr" for="url">SoundCloud track or playlist link</label>
    <input id="url" class="at" type="url" required placeholder="Paste SoundCloud URL here...">
    <button id="go" class="at" type="submit"><span class="sr">Convert</span></button>
  </form>
  <p id="status" class="at" role="status" aria-live="polite"></p>
  <h2 class="sr">Downloadable tracks</h2>
  <a id="zip" class="at mp3" aria-disabled="true" hidden>⤓ ZIP</a>
  <ol id="top" class="at"></ol>
  <button id="more" class="at" type="button" aria-label="Show the rest of the playlist" hidden>•••</button>
</section>
<div id="rest"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));
const TOP = 4, PER_PAGE = 11;
let busy = false;

function setStatus(text, err) {
  const s = $('status');
  if (s.textContent !== text) s.textContent = text;
  s.title = text;
  s.classList.toggle('err', !!err);
}

// Only site-relative or http(s) URLs from the API become links.
function setLink(a, url) {
  if (typeof url === 'string' && /^(\/(?!\/)|https?:\/\/)/.test(url)) {
    a.href = url;
    return true;
  }
  a.removeAttribute('href');
  return false;
}

const clock = (ms) => { const s = Math.round((Number(ms) || 0) / 1000); return s ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : ''; };

function makeRow(t, big) {
  const li = document.createElement('li');
  const tile = document.createElement('img');
  tile.className = 'tile';
  tile.alt = '';
  tile.src = big ? '/tile-big.png' : '/tile-small.png';
  const txt = document.createElement('div');
  txt.className = 'txt';
  const title = document.createElement('div');
  title.className = 't';
  title.textContent = t.title || 'track';
  const sub = document.createElement('div');
  sub.className = 's';
  txt.append(title, sub);
  const btn = document.createElement('a');
  btn.className = 'mp3';
  btn.setAttribute('aria-label', 'Download MP3: ' + title.textContent);
  li.append(tile, txt, btn);
  const it = {
    li, sub, btn, arrow: big ? '↓' : '⤓', meta: [t.artist, clock(t.duration)].filter(Boolean).join(' • '),
    progress_url: t.progress_url, progress: 0, text: 'Queued', message: '', done: false, failed: false, download_url: null,
  };
  renderRow(it);
  return it;
}

function renderRow(it) {
  it.sub.textContent = it.failed ? it.message || 'Conversion failed.' : it.meta;
  it.sub.classList.toggle('err', it.failed);
  const ready = it.done && !it.failed && setLink(it.btn, it.download_url);
  it.btn.textContent = ready ? it.arrow + ' MP3' : it.failed ? 'FAILED' : Math.floor(Math.min(1000, it.progress) / 10) + '%';
  it.btn.setAttribute('aria-disabled', String(!ready));
  it.btn.classList.toggle('err', it.failed);
}

// First four tracks go under the heading; the rest fill bird pages below, eleven per page.
function show(j) {
  let page;
  const items = (j.tracks || []).map((t, i) => {
    const big = i >= TOP;
    if (big && (i - TOP) % PER_PAGE === 0) {
      const s = document.createElement('section');
      s.className = 'birds';
      page = document.createElement('ol');
      page.className = 'at';
      s.append(page);
      $('rest').append(s);
    }
    const it = makeRow(t, big);
    (big ? page : $('top')).append(it.li);
    return it;
  });
  const n = items.length;
  const zip = $('zip');
  zip.hidden = j.kind !== 'playlist';
  $('more').hidden = n <= TOP;
  return {
    items,
    render() {
      items.forEach(renderRow);
      const ok = items.filter((it) => it.done && !it.failed).length;
      const bad = items.filter((it) => it.failed).length;
      const finished = ok + bad === n;
      const zipReady = finished && ok > 0 && setLink(zip, j.zip_url);
      zip.setAttribute('aria-disabled', String(!zipReady));
      if (!finished) setStatus(n === 1 ? 'Converting…' : `Converting… ${ok + bad} of ${n} done`);
      else if (!ok) setStatus(n === 1 ? items[0].sub.textContent : 'No tracks converted.', true);
      else setStatus(bad ? `Done. ${bad} of ${n} failed.` : n === 1 ? 'Done.' : `Done. All ${n} tracks ready.`);
    },
  };
}

async function pollItem(it) {
  try {
    const r = await fetch(it.progress_url);
    const j = await r.json();
    if (!r.ok) {
      it.done = true;
      it.failed = true;
      it.message = j.message || 'Lost track of the job.';
      return;
    }
    it.progress = Number(j.progress) || 0;
    it.text = j.text || it.text;
    it.message = j.message || '';
    it.download_url = j.download_url || null;
    it.done = it.progress >= 1000 || j.text === 'Error';
    it.failed = j.text === 'Error' || (it.done && !j.success);
  } catch (err) {
    // Network hiccup: leave the item as it was and try again next tick.
  }
}

async function runJob(job) {
  job.render();
  while (job.items.some((it) => !it.done)) {
    await Promise.all(job.items.filter((it) => !it.done).map(pollItem));
    job.render();
    if (job.items.some((it) => !it.done)) await sleep(1500);
  }
  busy = false;
  $('go').disabled = false;
}

// Opened straight from disk: relative /api calls can't reach the server.
if (location.protocol === 'file:') setStatus('Open http://localhost:8787 instead of this file (start it with: node server.js).', true);

$('more').addEventListener('click', () => $('rest').firstElementChild?.scrollIntoView({ behavior: 'smooth' }));

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy) return;
  busy = true;
  $('go').disabled = true;
  $('top').replaceChildren();
  $('rest').replaceChildren();
  $('zip').hidden = true;
  $('more').hidden = true;
  setStatus('Starting…');
  let job;
  try {
    const r = await fetch('/api/download?format=mp3&url=' + encodeURIComponent($('url').value.trim()));
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.message || 'Request failed.');
    job = show(j);
  } catch (err) {
    setStatus(err.message || 'Request failed.', true);
    busy = false;
    $('go').disabled = false;
    return;
  }
  await runJob(job);
});
</script>
</body>
</html>

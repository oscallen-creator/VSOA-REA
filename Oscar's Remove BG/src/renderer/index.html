<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Oscar's Remove BG</title>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- Icon sprite: every icon is drawn with currentColor strokes. -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24">
        <path d="M12 4v13M6 11.5l6 6 6-6M5 21h14" />
      </symbol>
      <symbol id="i-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M8 12.5l2.9 2.9L16.5 9.5" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5.5M12 7.6h.01" />
      </symbol>
      <symbol id="i-warning" viewBox="0 0 24 24">
        <path d="M12 3.5l9.5 16.5h-19z" />
        <path d="M12 10v4.5M12 17.4h.01" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6" />
        <path d="M15 15l5.5 5.5" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path
          d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
        />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
      </symbol>
    </svg>

    <header class="toolbar">
      <button
        id="add"
        class="icon-btn solid"
        type="button"
        title="Add images"
        aria-label="Add images"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
      </button>
      <p class="hint">Drag images or folders into the area below</p>
      <span id="brand" class="brand">Oscar's Remove BG</span>
    </header>

    <main id="list-area" class="list-area">
      <button id="empty" class="empty" type="button">
        <svg class="icon big" aria-hidden="true"><use href="#i-down" /></svg>
        <span>Drop images here or click to add</span>
      </button>
      <table id="table" class="table" aria-label="Images" hidden>
        <thead>
          <tr>
            <th scope="col">File</th>
            <th scope="col">Output</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>

    <section class="options" aria-label="Options">
      <fieldset id="controls" class="controls">
        <legend class="sr-only">Options</legend>

        <div class="opt-row">
          <div class="field" role="group" aria-labelledby="bg-label">
            <span id="bg-label" class="label">Background:</span>
            <div class="segmented">
              <button type="button" data-bg="transparent" aria-pressed="true">
                Transparent
              </button>
              <button type="button" data-bg="color" aria-pressed="false">
                Colored
              </button>
            </div>
          </div>
          <div id="psd-field" class="field">
            <label class="check">
              <input id="use-psd" type="checkbox" aria-describedby="psd-hint" />
              <span>Photoshop file</span>
            </label>
            <span id="psd-hint" class="hint">
              Layered PSD with an editable layer mask
            </span>
          </div>
          <div id="color-field" class="field" hidden>
            <span class="color-pick">
              <span id="color-swatch" class="swatch"></span>
              <input
                id="color-picker"
                type="color"
                aria-label="Background color"
              />
            </span>
            <input
              id="color-hex"
              type="text"
              maxlength="7"
              size="8"
              spellcheck="false"
              autocomplete="off"
              placeholder="#RRGGBB"
              aria-label="Background color as #RRGGBB"
            />
            <div
              id="palette"
              class="palette"
              role="group"
              aria-label="Quick colors"
            ></div>
          </div>
        </div>

        <div class="opt-row">
          <div class="field">
            <label class="label" for="shadow">Shadow:</label>
            <select id="shadow">
              <option value="none">Off</option>
              <option value="auto">Autodetect</option>
              <option value="car">Car</option>
              <option value="3D">3D</option>
              <option value="drop">Drop Shadow</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="opacity">Opacity:</label>
            <select id="opacity"></select>
            <span id="custom-opacity" class="field tight" hidden>
              <input
                id="opacity-custom"
                type="number"
                min="0"
                max="100"
                step="1"
                aria-label="Custom shadow opacity in percent"
              />
              <span>%</span>
            </span>
          </div>
          <div class="field">
            <label class="label" for="size">Output size:</label>
            <select id="size">
              <option value="auto">Automatic</option>
              <option value="preview">Preview Size</option>
              <option value="full">Full Size</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="quality">Quality:</label>
            <select id="quality" aria-describedby="quality-hint">
              <option value="best">Best</option>
              <option value="fast">Fast</option>
            </select>
            <span id="quality-hint" class="hint">Fast uses a small model</span>
          </div>
        </div>

        <div class="opt-row">
          <div class="field">
            <span class="label">Output folder:</span>
            <button
              id="open-output"
              class="path-btn"
              type="button"
              title="Open output folder"
            ></button>
            <button id="change-output" class="link" type="button">
              Change
            </button>
          </div>
        </div>
      </fieldset>

      <div class="run-actions">
        <button id="clear" class="btn" type="button">Clear list</button>
        <button id="start" class="btn primary" type="button">Start</button>
        <button id="cancel" class="btn" type="button" hidden>Cancel</button>
      </div>
    </section>

    <footer class="statusbar">
      <p id="status" role="status">
        <span id="status-text"></span>
        <button id="status-open" class="link" type="button" hidden>
          open output folder
        </button>
      </p>
      <p id="model-text"></p>
    </footer>

    <dialog id="alert" aria-label="Notice">
      <p id="alert-message"></p>
      <div class="dialog-actions">
        <button id="alert-ok" class="btn primary" type="button" autofocus>
          OK
        </button>
      </div>
    </dialog>

    <template id="row-template">
      <tr class="row">
        <td>
          <div class="cell">
            <span class="status" role="img"></span>
            <span class="file">
              <span class="name"></span>
              <span class="path" hidden></span>
              <span class="note" hidden></span>
            </span>
          </div>
        </td>
        <td>
          <div class="cell">
            <span class="output"></span>
            <span class="row-actions"></span>
          </div>
        </td>
      </tr>
    </template>
  </body>
</html>
